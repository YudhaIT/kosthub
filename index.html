nav button{position:relative;z-index:1}nav button span{line-height:0;margin-bottom:3px}nav button.on{background:none!important;border-color:transparent!important;color:var(--on)}
.ind{position:absolute;top:5px;bottom:5px;left:5px;border-radius:18px;background:var(--a);border:2px solid var(--bd);transition:transform .45s cubic-bezier(.3,1.35,.5,1),background .3s;pointer-events:none}
@media (min-width:860px){.ind{top:6px;left:6px;right:auto;bottom:auto;height:calc((100% - 12px)/6);width:calc(100% - 12px)!important;transform:translateY(var(--ty,0))!important}}
.gear{display:grid;place-items:center}.fab{display:grid;place-items:center}
.grab{width:44px;height:5px;border-radius:9px;background:var(--bd);opacity:.35;margin:-4px auto 12px}
.toast{background:var(--ink);color:var(--bg);box-shadow:0 12px 30px -8px #0007;border-radius:16px;padding:11px 16px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="intro"></div>
<div id="lock"></div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="fabw"></div>
<div id="scn"></div>
<div id="ov"><div id="sh"></div></div>
<script src="jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'−':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const CATS={makan:['🍜','Makan'],kos:['🏠','Kos'],jalan:['🚌','Transport'],kuliah:['📚','Kuliah'],jajan:['🧋','Jajan'],lain:['💸','Lainnya'],gaji:['💰','Kiriman']};
const KEY='kosthub-v1';
let S={wallets:[{id:'w1',name:'Cash',init:0},{id:'w2',name:'ATM',init:0},{id:'w3',name:'GoPay',init:0}],tx:[],classes:[],tasks:[],routine:[],rdone:{},notes:[],budget:{},hist:{},stock:[],courses:[],notif:false,tgt:3.5,rem:24,mas:{color:'#fff7e6',hat:'toga',name:'Kosti'},theme:0,mode:'auto',pin:'',name:'',seen:false,xp:0,xpd:{},xph:{},fs:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(save.t);save.t=setTimeout(()=>typeof sched==='function'&&sched(),700)};
const DS=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];let hsub='hari';
let tab='home',sub='tugas',scanPages=[],files=[],CV={},onSave=null;
const TABS=[['home','🏡','Beranda','#ffd84d'],['uang','🪙','Uang','#7be0a8'],['kuliah','📚','Kuliah','#8cc8ff'],['harian','🧺','Harian','#ffb48a'],['dapur','🍳','Dapur','#ff9aa8'],['berkas','🗂️','Berkas','#c9a8ff']];
const FABS={uang:'Catat transaksi',kuliah:'Tambah',harian:'Tambah kegiatan',berkas:'Tambah berkas'};

let _db;const idb=()=>_db||(_db=new Promise((res,rej)=>{try{const q=indexedDB.open('kosthub',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}}));
const tx=async(m,f)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('files',m),r=f(t.objectStore('files'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const fPut=o=>tx('readwrite',s=>s.put(o)),fAll=()=>tx('readonly',s=>s.getAll()),fDel=id=>tx('readwrite',s=>s.delete(id));
const loadFiles=async()=>{try{files=(await fAll()).sort((a,b)=>b.date.localeCompare(a.date))}catch(e){files=[]}};
const toast=t=>{const m=document.createElement('div');m.className='toast';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),2400)};
const val=id=>($('#'+id)||{}).value||'';
const bal=w=>w.init+S.tx.filter(t=>t.w===w.id).reduce((a,t)=>a+(t.type==='in'?t.amt:-t.amt),0);
const empty=(e,t)=>`<div class="empty"><b>${e}</b>${t}</div>`;
const fld=(id,l,type='text',ph='')=>`<label class="f"><span>${l}</span><input id="${id}" type="${type}" placeholder="${ph}" ${type==='number'?'inputmode="numeric"':''}></label>`;
const chips=(g,list,def)=>{CV[g]=def;return `<div class="chips" data-g="${g}">${list.map(([v,l])=>`<button class="chip ${v===def?'on':''}" data-a="chip" data-g="${g}" data-v="${v}">${l}</button>`).join('')}</div>`};
const todayIdx=()=>(new Date().getDay()+6)%7;

function openSheet(title,html,label,fn){onSave=fn;$('#sh').innerHTML=`<div class="grab"></div><div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0;font-size:21px">${title}</h2><button class="x" data-a="close">✕</button></div>${html}${label?`<button class="btn" style="width:100%;margin-top:6px" data-a="sv">${label}</button>`:''}`;$('#ov').classList.add('on')}
const closeSheet=()=>{$('#ov').classList.remove('on');onSave=null};

function vHome(){
  const tot=S.wallets.reduce((a,w)=>a+bal(w),0),h=new Date().getHours();
  const cls=S.classes.filter(c=>c.day===DAYS[todayIdx()]).sort((a,b)=>a.time.localeCompare(b.time));
  const tk=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,3);
  const dn=S.rdone[today()]||[],rtd=rToday(),rd=rtd.filter(r=>dn.includes(r.id)).length,pc=rtd.length?Math.round(rd/rtd.length*100):0;
  return xpCard()+hintCard()+statRow()+`<div class="card a">${spark()}<div class="mu">Total semua dompet</div><div class="big" data-n="${tot}">${rp(tot)}</div><div class="mu">${S.wallets.length} dompet · pengeluaran bulan ini ${rp(S.tx.filter(t=>t.type==='out'&&t.date.startsWith(today().slice(0,7))).reduce((a,t)=>a+t.amt,0))}</div></div>
  <div class="two"><div class="card"><h2>🎒 Kuliah hari ini</h2>${cls.length?cls.map(c=>`<div class="it"><div class="em">${esc(c.time)}</div><div class="b">${esc(c.name)}<div class="mu">${esc(c.room||'')}</div></div></div>`).join(''):empty('😴','Kosong! Waktunya rebahan')}</div>
  <div class="card"><h2>⏰ Deadline terdekat</h2>${tk.length?tk.map(t=>`<div class="it"><div class="b">${esc(t.title)}<div class="mu ${t.due&&t.due<today()?'late':''}">${esc(t.due||'tanpa tenggat')}</div></div></div>`).join(''):empty('🎉','Tidak ada tugas nunggak')}</div></div>
  <div class="card" style="margin-top:14px"><h2>🧺 Rutinitas hari ini</h2><div class="bar"><i style="width:${pc}%"></i></div><div class="mu" style="margin-top:6px">${rtd.length?rd+' dari '+rtd.length+' selesai':'Tidak ada kegiatan hari ini'}</div></div>`}

function vDompet(){
  const l=[...S.tx].reverse().slice(0,25).map(t=>{const w=S.wallets.find(x=>x.id===t.w),c=CATS[t.cat]||CATS.lain;return `<div class="it"><div class="em">${c[0]}</div><div class="b">${esc(t.note||c[1])}<div class="mu">${esc(w?w.name:'?')} · ${esc(t.date)}</div></div><b class="${t.type==='in'?'pos':'neg'}">${t.type==='in'?'+':'−'}${rp(t.amt).replace('−','')}</b><button class="x" data-a="dtx" data-id="${t.id}">✕</button></div>`}).join('')||empty('🪙','Belum ada catatan. Tekan + dulu!');
  return `<div class="grid g3" style="margin-bottom:14px">${S.wallets.map(w=>`<div class="card wal"><div class="mu">${esc(w.name)}</div><b class="${bal(w)<0?'neg':''}">${rp(bal(w))}</b></div>`).join('')}<button class="btn g" data-a="nw" style="border-style:dashed;box-shadow:none">+ Dompet</button></div><div class="card"><h2>Riwayat</h2>${l}</div>`}

function vKuliah(){
  const seg=`<div class="seg"><button class="chip ${sub==='tugas'?'on':''}" data-a="sub" data-v="tugas">📝 Tugas</button><button class="chip ${sub==='jadwal'?'on':''}" data-a="sub" data-v="jadwal">🗓️ Jadwal</button><button class="chip ${sub==='nilai'?'on':''}" data-a="sub" data-v="nilai">🎓 Nilai</button></div>`;
  if(sub==='nilai')return seg+vNilai();if(sub==='tugas'){const l=[...S.tasks].sort((a,b)=>(a.done-b.done)||(a.due||'9').localeCompare(b.due||'9')).map(t=>{const late=!t.done&&t.due&&t.due<today();return `<div class="it"><input type="checkbox" class="ck" data-a="ttk" data-id="${t.id}" ${t.done?'checked':''}><div class="b ${t.done?'done':''}">${esc(t.title)}<div class="mu">${esc(t.course||'')}${t.course?' · ':''}<span class="${late?'late':''}">${esc(t.due||'tanpa tenggat')}${late?' · lewat!':''}</span></div></div><button class="x" data-a="dtk" data-id="${t.id}">✕</button></div>`}).join('');
    return seg+notifCard()+`<div class="card">${l||empty('📝','Belum ada tugas. Aman!')}</div>`}
  const l=DAYS.map((d,i)=>{const c=S.classes.filter(x=>x.day===d).sort((a,b)=>a.time.localeCompare(b.time));return c.length?`<div class="card"><h2>${d}${i===todayIdx()?' <span class="chip on" style="font-size:11px;padding:2px 8px">hari ini</span>':''}</h2>${c.map(x=>`<div class="it"><div class="em" style="font-size:12px">${esc(x.time)}</div><div class="b">${esc(x.name)}<div class="mu">${esc(x.room||'-')}</div></div><button class="x" data-a="dcl" data-id="${x.id}">✕</button></div>`).join('')}</div>`:''}).join('');
  return seg+(l||`<div class="card">${empty('🗓️','Belum ada jadwal kuliah')}</div>`)}

const dayTag=r=>!r.days||r.days.length===7?'Setiap hari':r.days.map(i=>DS[i]).join(' ');
const rToday=()=>S.routine.filter(r=>!r.days||r.days.includes(todayIdx()));
function vHarian(){const dn=S.rdone[today()]||[],ti=todayIdx(),all=hsub==='semua',list=(all?[...S.routine]:rToday()).sort((a,b)=>a.time.localeCompare(b.time));
  const seg=`<div class="seg"><button class="chip ${!all?'on':''}" data-a="hsub" data-v="hari">☀️ Hari ini</button><button class="chip ${all?'on':''}" data-a="hsub" data-v="semua">📅 Semua</button><button class="chip ${hsub==='fokus'?'on':''}" data-a="hsub" data-v="fokus">🍅 Fokus</button></div>`;
  if(hsub==='fokus')return seg+vFokus();
  const l=list.map(r=>all?`<div class="it"><div class="em" style="font-size:12px">${esc(r.time)}</div><div class="b">${esc(r.text)}<div class="mu">${dayTag(r)}</div></div><button class="x" data-a="drt" data-id="${r.id}">✕</button></div>`:`<div class="it"><input type="checkbox" class="ck" data-a="trt" data-id="${r.id}" ${dn.includes(r.id)?'checked':''}><div class="b ${dn.includes(r.id)?'done':''}">${esc(r.text)}<div class="mu">${esc(r.time)} · ${dayTag(r)}</div></div><button class="x" data-a="drt" data-id="${r.id}">✕</button></div>`).join('');
  return seg+(all?'':streakCard())+`<div class="card"><h2>${all?'Semua kegiatan':DAYS[ti]}</h2>${all?'':'<div class="mu" style="margin-bottom:6px">Checklist reset otomatis tiap hari</div>'}${l||empty('🧺',all?'Belum ada kegiatan':'Hari ini kosong. Tekan + buat nambah')}</div>`}

function bList(){const q=BQ.toLowerCase();
  if(bsub==='catatan'){const n=S.notes.filter(x=>(x.title+x.body).toLowerCase().includes(q));return n.length?`<div class="card">${n.map(x=>`<div class="it"><div class="b"><b>${esc(x.title)}</b><div class="mu" style="white-space:pre-wrap">${esc(x.body)}</div></div><button class="x" data-a="dn" data-id="${x.id}">✕</button></div>`).join('')}</div>`:`<div class="card">${empty('📝',q?'Tidak ketemu':'Belum ada catatan')}<button class="btn" style="width:100%" data-a="bnote">＋ Catatan baru</button></div>`}
  const m={materi:['Materi kuliah','Lainnya'],tugas:['Lampiran tugas'],scan:['Hasil scan']}[bsub],L=files.filter(f=>m.includes(f.cat)&&(f.name+(f.course||'')).toLowerCase().includes(q));
  const mt={materi:['📖','Belum ada materi','Upload materi'],tugas:['📎','Belum ada lampiran tugas','Upload lampiran'],scan:['📷','Belum ada hasil scan','Scan dokumen']}[bsub];
  if(!L.length)return `<div class="card">${empty(mt[0],q?'Tidak ketemu':mt[1])}<button class="btn" style="width:100%" data-a="${bsub==='scan'?'bscan':'bup'}" data-v="${bsub==='tugas'?'Lampiran tugas':'Materi kuliah'}">${mt[2]}</button></div>`;
  const g={};L.forEach(f=>{const k=f.course||'Tanpa mata kuliah';(g[k]=g[k]||[]).push(f)});
  return Object.entries(g).map(([k,a])=>`<div class="card"><h2>${esc(k)} <span class="mu">${a.length}</span></h2>${a.map(f=>`<div class="it"><div class="em">${/pdf$/i.test(f.name)?'📕':/\.(png|jpe?g|webp|gif)$/i.test(f.name)?'🖼️':'📄'}</div><div class="b">${esc(f.name)}<div class="mu">${esc(f.date)} · ${(f.blob.size/1024).toFixed(0)} KB</div></div><button class="btn s g" data-a="dlf" data-id="${f.id}">Bagikan</button><button class="x" data-a="dff" data-id="${f.id}">✕</button></div>`).join('')}</div>`).join('')}
function vBerkas(){const n=k=>({materi:files.filter(f=>['Materi kuliah','Lainnya'].includes(f.cat)).length,tugas:files.filter(f=>f.cat==='Lampiran tugas').length,scan:files.filter(f=>f.cat==='Hasil scan').length,catatan:S.notes.length})[k];
  const T=[['materi','📖','Materi'],['tugas','📎','Tugas'],['scan','📷','Scan'],['catatan','📝','Catatan']];
  return `<div class="seg bs">${T.map(([k,e,l])=>`<button class="chip ${bsub===k?'on':''}" data-a="bsub" data-v="${k}">${e} ${l}<small> ${n(k)}</small></button>`).join('')}</div>${bsub==='scan'?'<button class="btn" style="width:100%;margin-bottom:14px" data-a="bscan">📷 Scan dokumen baru</button>':''}<input id="bq" placeholder="🔍 Cari berkas…" value="${esc(BQ)}" style="margin-bottom:14px"><div id="bl">${bList()}</div>`}
document.addEventListener('input',e=>{if(e.target.id==='bq'){BQ=e.target.value;$('#bl').innerHTML=bList()}});

function scanBody(){return `<div class="th">${scanPages.map((p,i)=>`<div><img src="${p.url}" alt="Halaman ${i+1}"><b data-a="dsp" data-i="${i}">✕</b></div>`).join('')}</div><button class="btn g s" data-a="zmore" style="margin-bottom:12px">＋ Tambah halaman</button>${fld('sn','Nama PDF','text','Tugas Statistik')}${fld('sk','Mata kuliah (opsional)')}<button class="btn" style="width:100%" data-a="mkpdf" ${scanPages.length?'':'disabled'}>Buat PDF (${scanPages.length} hal)</button>`}
function openScan(){SC.pages=[];SC.q=[];scCam()}

async function render(an){
  const T=TABS.find(t=>t[0]===tab);document.body.style.setProperty('--a',THEMES[S.theme||0].a[TABS.indexOf(T)]);
  if(tab==='berkas')await loadFiles();
  const hr=new Date().getHours(),gr=hr<11?'Pagi':hr<15?'Siang':hr<18?'Sore':'Malam';
  const ttl={home:`Selamat ${gr.toLowerCase()}, ${S.name?esc(S.name):'anak kost'}!`,uang:'Dompet',kuliah:'Kuliah',harian:'Rutinitas',dapur:'Dapur Hemat',berkas:'Berkas'}[tab];
  const tm=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
  $('#app').innerHTML=`<div class="top"><div class="mas">${masSVG(46)}</div><div><h1>${ttl}</h1><small>${tm}</small></div><button class="gear" data-a="set" aria-label="Pengaturan">${ic('gear',20)}</button></div>`+{home:vHome,uang:vUang,kuliah:vKuliah,harian:vHarian,dapur:vDapur,berkas:vBerkas}[tab]();
  paintNav();
  $('#fabw').innerHTML=FABS[tab]&&!(tab==='harian'&&hsub==='fokus')?`<button class="btn fab" data-a="fab" aria-label="${FABS[tab]}">${ic('plus',26)}</button>`:'';
  if(an)anim();
}

function fab(){
  if(tab==='uang'&&usub==='anggaran')return budSheet();
  if(tab==='kuliah'&&sub==='nilai')return courseSheet();
  const wo=S.wallets.map(w=>`<option value="${esc(w.id)}">${esc(w.name)}</option>`).join('');
  if(tab==='uang')openSheet('Catat transaksi',chips('tt',[['out','Keluar'],['in','Masuk']],'out')+`<div style="height:10px"></div><label class="f"><span>Dompet</span><select id="tw">${wo}</select></label>${fld('ta','Jumlah (Rp)','number','15000')}${fld('tn','Catatan','text','Nasi goreng')}<div class="mu" style="margin-bottom:4px">Kategori</div>${chips('tc',Object.entries(CATS).map(([k,v])=>[k,v[0]+' '+v[1]]),'makan')}<div style="height:14px"></div>`,'Simpan',()=>{const amt=+val('ta');if(!(amt>0))return toast('Isi jumlah dulu');S.tx.push({id:uid(),w:val('tw'),type:CV.tt,amt,note:val('tn').trim(),cat:CV.tt==='in'?'gaji':CV.tc,date:today()});xp(3,'tx:'+today()+':'+(S.tx.length%5));return true});
  else if(tab==='kuliah'&&sub==='tugas')openSheet('Tugas baru',fld('kt','Judul tugas','text','Laporan Basis Data')+fld('kc','Mata kuliah')+fld('kd','Deadline','date'),'Simpan',()=>{const t=val('kt').trim();if(!t)return toast('Isi judul dulu');S.tasks.push({id:uid(),title:t,course:val('kc').trim(),due:val('kd'),done:false});return true});
  else if(tab==='kuliah')openSheet('Jadwal kuliah',`<label class="f"><span>Hari</span><select id="cd">${DAYS.map(d=>`<option ${d===DAYS[todayIdx()]?'selected':''}>${d}</option>`).join('')}</select></label>${fld('ct','Jam','time')}${fld('cn','Mata kuliah')}${fld('cr','Ruang')}`,'Simpan',()=>{const n=val('cn').trim();if(!n)return toast('Isi mata kuliah');S.classes.push({id:uid(),day:val('cd'),time:val('ct')||'00:00',name:n,room:val('cr').trim()});return true});
  else if(tab==='harian')openSheet('Kegiatan baru',fld('rt','Jam','time')+fld('rx','Kegiatan','text','Cuci baju')+'<div class="mu" style="margin:4px 0">Hari apa saja?</div><div class="chips" id="dys">'+DS.map((d,i)=>`<button class="chip dc on" data-a="dchip" data-i="${i}">${d}</button>`).join('')+'</div><div style="height:12px"></div>','Simpan',()=>{const t=val('rx').trim();if(!t)return toast('Isi kegiatan');const days=[...document.querySelectorAll('#dys .dc.on')].map(e=>+e.dataset.i);if(!days.length)return toast('Pilih minimal satu hari');S.routine.push({id:uid(),time:val('rt')||'07:00',text:t,days});return true});
  else if(tab==='berkas'){if(bsub==='scan')openScan();else if(bsub==='catatan')noteSheet();else{upSheet();$('#fc').value=bsub==='tugas'?'Lampiran tugas':'Materi kuliah'}}
}
const upSheet=()=>openSheet('Upload file',`<label class="f"><span>Jenis</span><select id="fc"><option>Materi kuliah</option><option>Lampiran tugas</option><option>Lainnya</option></select></label>${fld('fk','Mata kuliah (opsional)')}<label class="f"><span>File</span><input id="ff" type="file" multiple></label>`,'Simpan',async()=>{const fs=[...$('#ff').files];if(!fs.length)return toast('Pilih file dulu');try{for(const f of fs)await fPut({id:uid(),name:f.name,cat:val('fc'),course:val('fk').trim(),date:today(),blob:f})}catch(e){toast('Penyimpanan browser penuh/gagal');return}return true});
const noteSheet=()=>openSheet('Catatan materi',fld('nt','Judul')+`<label class="f"><span>Isi</span><textarea id="nb" rows="5"></textarea></label>`,'Simpan',()=>{const t=val('nt').trim();if(!t)return toast('Isi judul');S.notes.unshift({id:uid(),title:t,body:val('nb')});return true});

function prep(file,doc){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);if(doc){const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-110)*1.9+150));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0)}URL.revokeObjectURL(u);res({url:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height})};im.onerror=()=>rej();im.src=u})}
async function saveOut(name,blob){const P={Filesystem:plug('Filesystem'),Share:plug('Share')};

  if(a==='mkpdf'){if(!window.jspdf)return toast('Library PDF belum termuat');const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'});
    scanPages.forEach((p,i)=>{if(i)pdf.addPage();const r=Math.min(200/p.w,287/p.h),w=p.w*r,h=p.h*r;pdf.addImage(p.url,'JPEG',(210-w)/2,(297-h)/2,w,h)});
    const nm=(val('sn').trim()||'Scan '+today()).replace(/[\\/:*?"<>|]/g,'-');

    scanPages=[];xp(10,'pdf:'+Date.now());closeSheet();tab='berkas';bsub='scan';toast('PDF tersimpan 📄');conf(innerWidth/2,innerHeight/2);render(1);return}
  if(a==='dlf'){const f=files.find(x=>x.id===id);if(f)saveOut(f.name,f.blob);return}

  else if(a==='drt')S.routine=S.routine.filter(x=>x.id!==id);
  else if(a==='dn')S.notes=S.notes.filter(x=>x.id!==id);
  save();render();
});

// deteksi kertas: Otsu + komponen terang terbesar + 4 sudut ekstrem
function detect(c){const w=Math.min(160,c.width),h=Math.max(1,Math.round(c.height*w/c.width)),t=cnv(w,h);t.getContext('2d').drawImage(c,0,0,w,h);const d=t.getContext('2d').getImageData(0,0,w,h).data,N=w*h,g=new Uint8Array(N),hs=new Array(256).fill(0);
  for(let i=0;i<N;i++){const v=(.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2])|0;g[i]=v;hs[v]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hs[i];let sB=0,wB=0,best=0,th=128;
  for(let i=0;i<256;i++){wB+=hs[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*hs[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}
  const lab=new Int32Array(N),st=[];let bl=0,bs=0,L=0;
  for(let s0=0;s0<N;s0++){if(g[s0]<=th||lab[s0])continue;L++;let n=0;st.push(s0);lab[s0]=L;while(st.length){const p=st.pop();n++;const px=p%w,py=(p/w)|0;for(const q of [px>0?p-1:-1,px<w-1?p+1:-1,py>0?p-w:-1,py<h-1?p+w:-1])if(q>=0&&g[q]>th&&!lab[q]){lab[q]=L;st.push(q)}}if(n>bs){bs=n;bl=L}}
  const def=[[.08,.08],[.92,.08],[.92,.92],[.08,.92]];if(bs<N*.15||bs>N*.97)return def;
  let a=[1e9,0,0],b=[-1e9,0,0],c2=[-1e9,0,0],d2=[1e9,0,0];
  for(let i=0;i<N;i++)if(lab[i]===bl){const x=i%w,y=(i/w)|0,s1=x+y,df=x-y;if(s1<a[0])a=[s1,x,y];if(s1>c2[0])c2=[s1,x,y];if(df>b[0])b=[df,x,y];if(df<d2[0])d2=[df,x,y]}
  return [a,b,c2,d2].map(q=>[q[1]/(w-1),q[2]/(h-1)])}
// luruskan perspektif (homografi kotak→segiempat)
function warp(c,n){const W=c.width,H=c.height,q=n.map(([x,y])=>[x*W,y*H]),ds=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let ow=Math.max(ds(q[0],q[1]),ds(q[3],q[2])),oh=Math.max(ds(q[0],q[3]),ds(q[1],q[2]));const k=Math.min(1,1400/Math.max(ow,oh,1));ow=Math.max(40,ow*k|0);oh=Math.max(40,oh*k|0);
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q,dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;let g=0,h=0;
  if(dx3||dy3){const de=dx1*dy2-dx2*dy1;g=(dx3*dy2-dx2*dy3)/de;h=(dx1*dy3-dx3*dy1)/de}
  const a=x1-x0+g*x1,b=x3-x0+h*x3,dd=y1-y0+g*y1,e=y3-y0+h*y3,sd=c.getContext('2d').getImageData(0,0,W,H).data,o=cnv(ow,oh),ox=o.getContext('2d'),od=ox.createImageData(ow,oh),p=od.data;
  for(let j=0;j<oh;j++){const v=j/oh;for(let i=0;i<ow;i++){const u=i/ow,z=g*u+h*v+1,sx=(a*u+b*v+x0)/z,sy=(dd*u+e*v+y0)/z,ix=Math.min(W-2,Math.max(0,sx|0)),iy=Math.min(H-2,Math.max(0,sy|0)),fx=Math.min(1,Math.max(0,sx-ix)),fy=Math.min(1,Math.max(0,sy-iy)),s=(iy*W+ix)*4,t=(i+j*ow)*4;

  ox.putImageData(od,0,0);return o}
// filter ala CamScanner: latar diestimasi dari piksel TERTERANG per blok (bukan rata-rata), teks dipertebal lalu dikontraskan
function bgOf(c){if(c._bg)return c._bg;const w=c.width,h=c.height,B=12,sw=Math.ceil(w/B),sh=Math.ceil(h/B),d=c.getContext('2d').getImageData(0,0,w,h).data,s=cnv(sw,sh),sx=s.getContext('2d'),si=sx.createImageData(sw,sh),sp=si.data;

  sx.putImageData(si,0,0);const big=cnv(w,h),bx2=big.getContext('2d');bx2.imageSmoothingQuality='high';bx2.drawImage(s,0,0,w,h);return c._bg=bx2.getImageData(0,0,w,h).data}
function dil(a,w,h,k){const t=new Float32Array(a.length);for(let y=0;y<h;y++){const r=y*w;for(let x=0;x<w;x++){const i=r+x;let m=a[i];if(x>0&&a[i-1]<m)m=a[i-1];if(x<w-1&&a[i+1]<m)m=a[i+1];t[i]=m}}
  for(let y=0;y<h;y++){const r=y*w;for(let x=0;x<w;x++){const i=r+x;let m=t[i];if(y>0&&t[i-w]<m)m=t[i-w];if(y<h-1&&t[i+w]<m)m=t[i+w];a[i]=a[i]*(1-k)+m*k}}}
function filt(c,m,A){A=A||SC.adj;const w=c.width,h=c.height,o=cnv(w,h),x=o.getContext('2d');x.drawImage(c,0,0);if(m==='asli'&&A.b===0&&A.k===50)return o;
  const id=x.getImageData(0,0,w,h),p=id.data,N=w*h,cl=v=>v<0?0:v>255?255:v;
  if(m==='asli'){const kf=.5+A.k/100;for(let i=0;i<N*4;i+=4)for(let k=0;k<3;k++)p[i+k]=cl((p[i+k]-128)*kf+128+A.b*2)}
  else{const q=bgOf(c),ch=m==='warna'?3:1,R=[];for(let k=0;k<ch;k++)R.push(new Float32Array(N));
    for(let i=0,j=0;j<N;i+=4,j++){if(ch===1)R[0][j]=(.3*p[i]+.59*p[i+1]+.11*p[i+2])/(.3*q[i]+.59*q[i+1]+.11*q[i+2]+1);else{R[0][j]=p[i]/(q[i]+1);R[1][j]=p[i+1]/(q[i+1]+1);R[2][j]=p[i+2]/(q[i+2]+1)}}
    const a=A.t/100*.85;if(a>0)R.forEach(r=>dil(r,w,h,a));
    let hw=Math.max(.06,.25-(A.k-50)*.003);if(m==='abu')hw*=1.8;const c0=.58-A.b*.004,lo=c0-hw,sp=2*hw;
    for(let i=0,j=0;j<N;i+=4,j++)for(let k=0;k<3;k++){let t=(R[ch===1?0:k][j]-lo)/sp;t=t<0?0:t>1?1:t;p[i+k]=t*t*(3-2*t)*255}}
  x.putImageData(id,0,0);return o}

  const late=S.tasks.filter(t=>!t.done&&t.due&&t.due<today()).length,soon=S.tasks.filter(t=>!t.done&&t.due&&(t.due===today()||t.due===dAgo(-1))).length;
