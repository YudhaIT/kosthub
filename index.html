<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KostHub</title>
<style>
:root{--bg:#fff3dc;--card:#fffdf7;--ink:#2b2118;--bd:#2b2118;--shc:#2b2118;--mu:#7d6b58;--dot:#f0d9aa;--er:#e5484d;--ok:#13a05f;--on:#2b2118;--a:#ffd84d;--sh:3px 3px 0 var(--shc);--r:18px;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1713;--card:#272019;--ink:#f6ecdd;--bd:#5c4d3e;--shc:#000;--mu:#b3a290;--dot:#2a231b;--er:#ff7b7f;--ok:#46d48d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1713;--card:#272019;--ink:#f6ecdd;--bd:#5c4d3e;--shc:#000;--mu:#b3a290;--dot:#2a231b;--er:#ff7b7f;--ok:#46d48d;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg) radial-gradient(var(--dot) 1.3px,transparent 1.3px) 0 0/20px 20px;color:var(--ink);font:600 15px/1.45 ui-rounded,"Trebuchet MS",system-ui,sans-serif;min-height:100%;padding-bottom:96px}
h1,h2,.fr{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-weight:600;margin:0}
main{max-width:700px;margin:0 auto;padding:14px 14px 0}
.top{display:flex;align-items:center;gap:12px;margin:6px 0 14px}.top h1{font-size:26px;line-height:1.1}.top small{display:block;color:var(--mu);font-weight:700;font-size:13px}
.mas{width:52px;height:52px;border-radius:50% 50% 46% 46%;background:var(--a);border:2px solid var(--bd);box-shadow:var(--sh);display:grid;place-items:center;font-size:26px;flex:0 0 auto;transform:rotate(-6deg)}
.card{background:var(--card);border:2px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:14px}
.card.a{background:var(--a);color:var(--on);border-color:var(--bd)}
.card.a .mu{color:#2b2118b0}
h2{font-size:18px;margin:0 0 8px;display:flex;align-items:center;gap:6px}
.mu{color:var(--mu);font-size:13px;font-weight:700}.big{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:34px;font-weight:700;line-height:1.1}
.grid{display:grid;gap:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.wal{padding:10px 12px;margin:0;border-radius:14px;background:var(--card)}.wal b{font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:17px}
.it{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:2px dashed color-mix(in srgb,var(--bd) 28%,transparent)}.it:first-of-type{border-top:0}
.it>.b{flex:1;min-width:0;overflow-wrap:anywhere}
.em{width:38px;height:38px;border-radius:12px;background:var(--a);border:2px solid var(--bd);display:grid;place-items:center;font-size:19px;flex:0 0 auto;color:var(--on)}
.pos{color:var(--ok)}.neg{color:var(--er)}.late{color:var(--er)}
.done{text-decoration:line-through;opacity:.5}
button,input,select,textarea{font:inherit;color:var(--ink)}
input,select,textarea{width:100%;background:var(--card);border:2px solid var(--bd);border-radius:12px;padding:10px 12px;min-width:0;outline:0}
input:focus,select:focus,textarea:focus{box-shadow:0 0 0 3px var(--a)}
label.f{display:block;margin-bottom:10px}label.f>span{display:block;font-size:13px;color:var(--mu);margin-bottom:4px}
.btn{background:var(--a);color:var(--on);border:2px solid var(--bd);border-radius:12px;box-shadow:var(--sh);padding:10px 16px;font-weight:800;cursor:pointer;font-family:ui-rounded,"Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-size:15px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shc)}.btn:disabled{opacity:.5}
.btn.g{background:var(--card);color:var(--ink)}.btn.s{padding:6px 10px;font-size:13px;box-shadow:2px 2px 0 var(--shc)}
.x{background:none;border:0;color:var(--mu);font-size:16px;cursor:pointer;padding:4px 8px;border-radius:8px}.x:hover{color:var(--er)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{border:2px solid var(--bd);background:var(--card);border-radius:99px;padding:5px 12px;cursor:pointer;font-weight:800;font-size:13px}
.chip.on{background:var(--a);color:var(--on);box-shadow:2px 2px 0 var(--shc)}
.seg{display:flex;gap:6px;margin-bottom:14px}.seg .chip{flex:1;text-align:center;padding:8px}
.bar{height:14px;border:2px solid var(--bd);border-radius:99px;background:var(--card);overflow:hidden}.bar i{display:block;height:100%;background:var(--ok);border-right:2px solid var(--bd);transition:width .4s}
.ck{appearance:none;width:26px;height:26px;border:2px solid var(--bd);border-radius:9px;background:var(--card);flex:0 0 auto;cursor:pointer;display:grid;place-items:center;margin:0;padding:0}
.ck:checked{background:var(--ok)}.ck:checked::after{content:"✓";color:#fff;font-weight:800;font-size:16px}
.empty{text-align:center;color:var(--mu);padding:14px 6px}.empty b{display:block;font-size:30px}
nav{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;display:flex;gap:4px;background:var(--card);border:2px solid var(--bd);border-radius:24px;box-shadow:var(--sh);padding:6px;z-index:5}
nav button{flex:1;background:none;border:2px solid transparent;border-radius:18px;padding:6px 0;font:700 11px ui-rounded,system-ui,sans-serif;color:var(--mu);cursor:pointer}
nav button span{display:block;font-size:21px;line-height:1.2}
nav button.on{background:var(--a);color:var(--on);border-color:var(--bd)}
.fab{position:fixed;right:max(16px,calc(50% - 340px));bottom:calc(92px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;font-size:30px;line-height:1;padding:0;z-index:4}
#ov{position:fixed;inset:0;background:#2b211888;display:none;align-items:flex-end;justify-content:center;z-index:20}
#ov.on{display:flex}
#sh{background:var(--card);border:2px solid var(--bd);border-radius:26px 26px 0 0;width:100%;max-width:520px;max-height:90vh;overflow:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.th{display:flex;gap:8px;overflow-x:auto;padding:6px 2px 10px}.th div{position:relative;flex:0 0 auto}
.th img{height:100px;border-radius:10px;border:2px solid var(--bd);display:block}
.th b{position:absolute;top:-4px;right:-4px;background:var(--er);color:#fff;border-radius:50%;width:22px;height:22px;text-align:center;font-size:12px;line-height:22px;cursor:pointer;border:2px solid var(--bd)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(170px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);border-radius:99px;padding:9px 16px;z-index:30;font-weight:800;max-width:90%;text-align:center}
@media (min-width:860px){
 body{padding-bottom:30px;padding-left:96px}main{max-width:820px;padding-top:24px}
 nav{left:14px;right:auto;top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column;width:74px;margin:0}
 nav button{padding:10px 0}.fab{right:max(24px,calc(50% - 360px + 48px));bottom:28px}
 #ov{align-items:center}#sh{border-radius:26px}
 .two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.two>.card{margin:0}
}

@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94) rotate(-1.5deg)}60%{transform:translateY(-3px) scale(1.02)}to{opacity:1;transform:none}}
#app.anim>*{animation:pop .5s cubic-bezier(.3,1.4,.5,1) both}
#app.anim>*:nth-child(2){animation-delay:.06s}#app.anim>*:nth-child(3){animation-delay:.12s}#app.anim>*:nth-child(4){animation-delay:.18s}#app.anim>*:nth-child(5){animation-delay:.24s}
#app.anim .it{animation:slide .4s both}@keyframes slide{from{opacity:0;transform:translateX(-14px)}}
@keyframes bob{0%,100%{transform:rotate(-6deg) translateY(0)}50%{transform:rotate(5deg) translateY(-5px)}}
.mas{animation:bob 3s ease-in-out infinite;cursor:pointer}
@keyframes jump{0%{transform:rotate(-6deg)}30%{transform:translateY(-20px) rotate(18deg) scale(1.2)}60%{transform:translateY(0) rotate(-14deg) scale(.9)}100%{transform:rotate(-6deg)}}
.mas.jump{animation:jump .6s}
@keyframes hop{0%,100%{transform:none}40%{transform:translateY(-8px) scale(1.25) rotate(-8deg)}}
nav button.on span{animation:hop .45s}
@keyframes wob{0%,86%,100%{transform:rotate(0)}90%{transform:rotate(-14deg) scale(1.1)}95%{transform:rotate(12deg)}}
.fab{animation:wob 3.5s ease-in-out infinite}.fab:active{animation:none}
.card,.btn{transition:transform .18s,box-shadow .18s}
@media (hover:hover){.card:hover{transform:translate(-2px,-2px);box-shadow:5px 5px 0 var(--shc)}.btn:hover{transform:translateY(-2px) rotate(-1deg)}}
.empty b{animation:flt 2.4s ease-in-out infinite}@keyframes flt{50%{transform:translateY(-8px) rotate(7deg)}}
.ck:checked{animation:stamp .4s cubic-bezier(.3,1.7,.5,1)}@keyframes stamp{0%{transform:scale(.5) rotate(-25deg)}}
.bar i{background:repeating-linear-gradient(45deg,var(--ok) 0 10px,color-mix(in srgb,var(--ok) 70%,#fff) 10px 20px);background-size:28px 28px;animation:str 1s linear infinite}@keyframes str{to{background-position:28px 0}}
#ov.on{animation:fd .2s}@keyframes fd{from{opacity:0}}
#sh{animation:up2 .4s cubic-bezier(.2,1.3,.4,1)}@keyframes up2{from{transform:translateY(70px) scale(.95);opacity:0}}
.toast{animation:tin .35s cubic-bezier(.3,1.6,.5,1)}@keyframes tin{from{transform:translate(-50%,20px) scale(.7);opacity:0}}
.cf{position:fixed;z-index:60;pointer-events:none;font-size:20px;animation:fly .95s ease-out forwards}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg) scale(.4);opacity:0}}
#scn{position:fixed;inset:0;background:#111;z-index:25;display:none;flex-direction:column;color:#fff}#scn.on{display:flex}
#scn video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scTop{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 10px;background:#000a;font-weight:800}
.scBot{position:relative;z-index:2;margin-top:auto;display:flex;justify-content:space-around;align-items:center;gap:10px;padding:12px 14px calc(14px + env(safe-area-inset-bottom,0px));background:#000a}
.sb{background:#fff2;color:#fff;border:2px solid #fff5;border-radius:99px;padding:9px 16px;font:800 14px ui-rounded,system-ui,sans-serif;cursor:pointer;min-width:48px;text-align:center}.sb:disabled{opacity:.35}.sb.on{background:var(--a);color:#2b2118;border-color:#fff}
.shut{width:74px;height:74px;border-radius:50%;background:#fff;border:6px solid var(--a);box-shadow:0 0 0 3px #fff;cursor:pointer;transition:transform .12s}.shut:active{transform:scale(.88)}
.gd{position:absolute;inset:16% 9%;border:3px dashed #fff9;border-radius:16px;pointer-events:none;animation:gl 2s ease-in-out infinite}@keyframes gl{50%{border-color:var(--a);transform:scale(1.02)}}
#cw{flex:1;min-height:0;display:grid;place-items:center;position:relative;z-index:1}
#cwi{position:relative;touch-action:none}#cwi canvas{display:block;width:100%;height:100%;border-radius:4px}
#cs{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hd{position:absolute;width:36px;height:36px;margin:-18px 0 0 -18px;border-radius:50%;background:var(--a);border:3px solid #fff;box-shadow:0 2px 10px #000a;touch-action:none}
.fl{display:flex;gap:8px;justify-content:center;padding:8px;background:#000a;position:relative;z-index:2;overflow-x:auto}
.adj{display:none;position:relative;z-index:2;background:#000c;padding:8px 16px}.adj.on{display:block}
.adj label{display:flex;align-items:center;gap:10px;font-weight:800;font-size:13px;margin:4px 0}.adj label span{width:88px}.adj input{flex:1;accent-color:var(--a)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav"></nav>
<div id="fabw"></div>
<div id="scn"></div>
<div id="ov"><div id="sh"></div></div>
<script src="jspdf.umd.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp=n=>(n<0?'−':'')+'Rp'+Math.abs(Math.round(n)).toLocaleString('id-ID');
const uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const CATS={makan:['🍜','Makan'],kos:['🏠','Kos'],jalan:['🚌','Transport'],kuliah:['📚','Kuliah'],jajan:['🧋','Jajan'],lain:['💸','Lainnya'],gaji:['💰','Kiriman']};
const KEY='kosthub-v1';
let S={wallets:[{id:'w1',name:'Cash',init:0},{id:'w2',name:'ATM',init:0},{id:'w3',name:'GoPay',init:0}],tx:[],classes:[],tasks:[],routine:[],rdone:{},notes:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const DS=['Sen','Sel','Rab','Kam','Jum','Sab','Min'];let hsub='hari';
let tab='home',sub='tugas',scanPages=[],files=[],CV={},onSave=null;
const TABS=[['home','🏡','Beranda','#ffd84d'],['uang','🪙','Uang','#7be0a8'],['kuliah','📚','Kuliah','#8cc8ff'],['harian','🧺','Harian','#ffb48a'],['berkas','🗂️','Berkas','#c9a8ff']];
const FABS={uang:'Catat transaksi',kuliah:'Tambah',harian:'Tambah kegiatan',berkas:'Tambah berkas'};

let _db;const idb=()=>_db||(_db=new Promise((res,rej)=>{try{const q=indexedDB.open('kosthub',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}catch(e){rej(e)}}));
const tx=async(m,f)=>{const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('files',m),r=f(t.objectStore('files'));t.oncomplete=()=>res(r.result);t.onerror=()=>rej(t.error)})};
const fPut=o=>tx('readwrite',s=>s.put(o)),fAll=()=>tx('readonly',s=>s.getAll()),fDel=id=>tx('readwrite',s=>s.delete(id));
const loadFiles=async()=>{try{files=(await fAll()).sort((a,b)=>b.date.localeCompare(a.date))}catch(e){files=[]}};
const toast=t=>{const m=document.createElement('div');m.className='toast';m.textContent=t;document.body.appendChild(m);setTimeout(()=>m.remove(),2400)};
const val=id=>($('#'+id)||{}).value||'';
const bal=w=>w.init+S.tx.filter(t=>t.w===w.id).reduce((a,t)=>a+(t.type==='in'?t.amt:-t.amt),0);
const empty=(e,t)=>`<div class="empty"><b>${e}</b>${t}</div>`;
const fld=(id,l,type='text',ph='')=>`<label class="f"><span>${l}</span><input id="${id}" type="${type}" placeholder="${ph}" ${type==='number'?'inputmode="numeric"':''}></label>`;
const chips=(g,list,def)=>{CV[g]=def;return `<div class="chips" data-g="${g}">${list.map(([v,l])=>`<button class="chip ${v===def?'on':''}" data-a="chip" data-g="${g}" data-v="${v}">${l}</button>`).join('')}</div>`};
const todayIdx=()=>(new Date().getDay()+6)%7;

function openSheet(title,html,label,fn){onSave=fn;$('#sh').innerHTML=`<div class="row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h2 style="margin:0;font-size:21px">${title}</h2><button class="x" data-a="close">✕</button></div>${html}${label?`<button class="btn" style="width:100%;margin-top:6px" data-a="sv">${label}</button>`:''}`;$('#ov').classList.add('on')}
const closeSheet=()=>{$('#ov').classList.remove('on');onSave=null};

function vHome(){
  const tot=S.wallets.reduce((a,w)=>a+bal(w),0),h=new Date().getHours();
  const cls=S.classes.filter(c=>c.day===DAYS[todayIdx()]).sort((a,b)=>a.time.localeCompare(b.time));
  const tk=S.tasks.filter(t=>!t.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9')).slice(0,3);
  const dn=S.rdone[today()]||[],rtd=rToday(),rd=rtd.filter(r=>dn.includes(r.id)).length,pc=rtd.length?Math.round(rd/rtd.length*100):0;
  return `<div class="card a"><div class="mu">Total semua dompet</div><div class="big" data-n="${tot}">${rp(tot)}</div><div class="mu">${S.wallets.length} dompet · pengeluaran bulan ini ${rp(S.tx.filter(t=>t.type==='out'&&t.date.startsWith(today().slice(0,7))).reduce((a,t)=>a+t.amt,0))}</div></div>
  <div class="two"><div class="card"><h2>🎒 Kuliah hari ini</h2>${cls.length?cls.map(c=>`<div class="it"><div class="em">${esc(c.time)}</div><div class="b">${esc(c.name)}<div class="mu">${esc(c.room||'')}</div></div></div>`).join(''):empty('😴','Kosong! Waktunya rebahan')}</div>
  <div class="card"><h2>⏰ Deadline terdekat</h2>${tk.length?tk.map(t=>`<div class="it"><div class="b">${esc(t.title)}<div class="mu ${t.due&&t.due<today()?'late':''}">${esc(t.due||'tanpa tenggat')}</div></div></div>`).join(''):empty('🎉','Tidak ada tugas nunggak')}</div></div>
  <div class="card" style="margin-top:14px"><h2>🧺 Rutinitas hari ini</h2><div class="bar"><i style="width:${pc}%"></i></div><div class="mu" style="margin-top:6px">${rtd.length?rd+' dari '+rtd.length+' selesai':'Tidak ada kegiatan hari ini'}</div></div>`}

function vUang(){
  const l=[...S.tx].reverse().slice(0,25).map(t=>{const w=S.wallets.find(x=>x.id===t.w),c=CATS[t.cat]||CATS.lain;return `<div class="it"><div class="em">${c[0]}</div><div class="b">${esc(t.note||c[1])}<div class="mu">${esc(w?w.name:'?')} · ${esc(t.date)}</div></div><b class="${t.type==='in'?'pos':'neg'}">${t.type==='in'?'+':'−'}${rp(t.amt).replace('−','')}</b><button class="x" data-a="dtx" data-id="${t.id}">✕</button></div>`}).join('')||empty('🪙','Belum ada catatan. Tekan + dulu!');
  return `<div class="grid g3" style="margin-bottom:14px">${S.wallets.map(w=>`<div class="card wal"><div class="mu">${esc(w.name)}</div><b class="${bal(w)<0?'neg':''}">${rp(bal(w))}</b></div>`).join('')}<button class="btn g" data-a="nw" style="border-style:dashed;box-shadow:none">+ Dompet</button></div><div class="card"><h2>Riwayat</h2>${l}</div>`}

function vKuliah(){
  const seg=`<div class="seg"><button class="chip ${sub==='tugas'?'on':''}" data-a="sub" data-v="tugas">📝 Tugas</button><button class="chip ${sub==='jadwal'?'on':''}" data-a="sub" data-v="jadwal">🗓️ Jadwal</button></div>`;
  if(sub==='tugas'){const l=[...S.tasks].sort((a,b)=>(a.done-b.done)||(a.due||'9').localeCompare(b.due||'9')).map(t=>{const late=!t.done&&t.due&&t.due<today();return `<div class="it"><input type="checkbox" class="ck" data-a="ttk" data-id="${t.id}" ${t.done?'checked':''}><div class="b ${t.done?'done':''}">${esc(t.title)}<div class="mu">${esc(t.course||'')}${t.course?' · ':''}<span class="${late?'late':''}">${esc(t.due||'tanpa tenggat')}${late?' · lewat!':''}</span></div></div><button class="x" data-a="dtk" data-id="${t.id}">✕</button></div>`}).join('');
    return seg+`<div class="card">${l||empty('📝','Belum ada tugas. Aman!')}</div>`}
  const l=DAYS.map((d,i)=>{const c=S.classes.filter(x=>x.day===d).sort((a,b)=>a.time.localeCompare(b.time));return c.length?`<div class="card"><h2>${d}${i===todayIdx()?' <span class="chip on" style="font-size:11px;padding:2px 8px">hari ini</span>':''}</h2>${c.map(x=>`<div class="it"><div class="em" style="font-size:12px">${esc(x.time)}</div><div class="b">${esc(x.name)}<div class="mu">${esc(x.room||'-')}</div></div><button class="x" data-a="dcl" data-id="${x.id}">✕</button></div>`).join('')}</div>`:''}).join('');
  return seg+(l||`<div class="card">${empty('🗓️','Belum ada jadwal kuliah')}</div>`)}

const dayTag=r=>!r.days||r.days.length===7?'Setiap hari':r.days.map(i=>DS[i]).join(' ');
const rToday=()=>S.routine.filter(r=>!r.days||r.days.includes(todayIdx()));
function vHarian(){const dn=S.rdone[today()]||[],ti=todayIdx(),all=hsub==='semua',list=(all?[...S.routine]:rToday()).sort((a,b)=>a.time.localeCompare(b.time));

function scanBody(){return `<div class="th">${scanPages.map((p,i)=>`<div><img src="${p.url}" alt="Halaman ${i+1}"><b data-a="dsp" data-i="${i}">✕</b></div>`).join('')}</div><button class="btn g s" data-a="zmore" style="margin-bottom:12px">＋ Tambah halaman</button>${fld('sn','Nama PDF','text','Tugas Statistik')}${fld('sk','Mata kuliah (opsional)')}<button class="btn" style="width:100%" data-a="mkpdf" ${scanPages.length?'':'disabled'}>Buat PDF (${scanPages.length} hal)</button>`}
function openScan(){SC.pages=[];SC.q=[];scCam()}

async function render(an){
  const T=TABS.find(t=>t[0]===tab);document.body.style.setProperty('--a',T[3]);
  if(tab==='berkas')await loadFiles();
  const hr=new Date().getHours(),gr=hr<11?'Pagi':hr<15?'Siang':hr<18?'Sore':'Malam';
  const ttl={home:`Selamat ${gr.toLowerCase()}, anak kost!`,uang:'Dompet',kuliah:'Kuliah',harian:'Rutinitas',berkas:'Berkas'}[tab];
  const tm=new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
  $('#app').innerHTML=`<div class="top"><div class="mas">${['😎','🪙','🤓','🧺','🐱'][TABS.indexOf(T)]}</div><div><h1>${ttl}</h1><small>${tm}</small></div></div>`+{home:vHome,uang:vUang,kuliah:vKuliah,harian:vHarian,berkas:vBerkas}[tab]();

function prep(file,doc){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);if(doc){const d=x.getImageData(0,0,c.width,c.height),p=d.data;for(let i=0;i<p.length;i+=4){let g=.3*p[i]+.59*p[i+1]+.11*p[i+2];g=Math.max(0,Math.min(255,(g-110)*1.9+150));p[i]=p[i+1]=p[i+2]=g}x.putImageData(d,0,0)}URL.revokeObjectURL(u);res({url:c.toDataURL('image/jpeg',.82),w:c.width,h:c.height})};im.onerror=()=>rej();im.src=u})}
async function saveOut(name,blob){const P=window.Capacitor&&Capacitor.Plugins;
  try{if(P&&P.Filesystem&&P.Share){const b64=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result.split(',')[1]);f.readAsDataURL(blob)});const w=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});await P.Share.share({title:name,url:w.uri,dialogTitle:'Simpan atau kirim file'})}
  else{const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();toast('Terunduh ✓')}}
  catch(e){if(!/cancel/i.test(String(e&&e.message)))toast('Gagal menyimpan file')}}

document.addEventListener('change',async e=>{
  const t=e.target,a=t.dataset.a;
  if(a==='ttk'){S.tasks.find(x=>x.id===t.dataset.id).done=t.checked;save();if(t.checked){toast('Mantap, satu beres! 🎉');const r=t.getBoundingClientRect();conf(r.left+13,r.top+13)}render()}
  else if(a==='trt'){const d=S.rdone[today()]||[],id=t.dataset.id,i=d.indexOf(id);if(t.checked&&i<0)d.push(id);if(!t.checked&&i>=0)d.splice(i,1);S.rdone={[today()]:d};save();if(t.checked){const r=t.getBoundingClientRect();conf(r.left+13,r.top+13,['✨','💚','⭐'])}render()}
  else if(t.id==='sgal'){SC.q=[...t.files];scNext()}

document.addEventListener('click',async e=>{
  if(e.target.id==='ov')return closeSheet();
  const ms=e.target.closest('.mas');if(ms){ms.classList.remove('jump');void ms.offsetWidth;ms.classList.add('jump');toast(['Semangat kuliahnya! 💪','Udah makan belum? 🍜','Minum air dulu 💧','Hemat pangkal kaya 🪙','Tugasnya dicicil ya 📝'][Math.random()*5|0]);const r=ms.getBoundingClientRect();conf(r.left+26,r.top+20);return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,v=b.dataset.v;
  if(a==='ttk'||a==='trt')return;
  if(a[0]==='z')return zAct(a,b);
  if(a==='tab'){tab=v;render(1);scrollTo(0,0);return}
  if(a==='sub'){sub=v;render();return}
  if(a==='hsub'){hsub=v;render();return}
  if(a==='dchip'){b.classList.toggle('on');return}
  if(a==='close')return closeSheet();
  if(a==='chip'){CV[b.dataset.g]=v;b.parentNode.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));return}
  if(a==='fab')return fab();
  if(a==='up')return upSheet();if(a==='scan')return openScan();if(a==='note')return noteSheet();
  if(a==='nw')return openSheet('Dompet baru',fld('wn','Nama','text','Dana, BCA…')+fld('wi','Saldo awal','number','0'),'Tambah',()=>{const n=val('wn').trim();if(!n)return toast('Isi nama');S.wallets.push({id:uid(),name:n,init:+val('wi')||0});return true});
  if(a==='sv'){if(onSave&&await onSave()){save();closeSheet();render()}return}
  if(a==='dsp'){scanPages.splice(+b.dataset.i,1);$('#sb').innerHTML=scanBody();return}
  if(a==='mkpdf'){if(!window.jspdf)return toast('Library PDF belum termuat');const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'mm',format:'a4'});
    scanPages.forEach((p,i)=>{if(i)pdf.addPage();const r=Math.min(200/p.w,287/p.h),w=p.w*r,h=p.h*r;pdf.addImage(p.url,'JPEG',(210-w)/2,(297-h)/2,w,h)});
    const nm=(val('sn').trim()||'Scan '+today()).replace(/[\\/:*?"<>|]/g,'-');
    try{await fPut({id:uid(),name:nm+'.pdf',cat:'Hasil scan',course:val('sk').trim(),date:today(),blob:pdf.output('blob')})}catch(x){return toast('Gagal menyimpan PDF')}
    scanPages=[];closeSheet();tab='berkas';toast('PDF tersimpan 📄');conf(innerWidth/2,innerHeight/2);render(1);return}
  if(a==='dlf'){const f=files.find(x=>x.id===id);if(f)saveOut(f.name,f.blob);return}
  if(a==='dff'){await fDel(id);return render()}
  if(a==='dtx')S.tx=S.tx.filter(x=>x.id!==id);
  else if(a==='dtk')S.tasks=S.tasks.filter(x=>x.id!==id);
  else if(a==='dcl')S.classes=S.classes.filter(x=>x.id!==id);
  else if(a==='drt')S.routine=S.routine.filter(x=>x.id!==id);
  else if(a==='dn')S.notes=S.notes.filter(x=>x.id!==id);
  save();render();
});

function conf(x,y,e=['🎉','✨','⭐','💖','🍀']){for(let i=0;i<12;i++){const s=document.createElement('span'),a=Math.random()*6.28,d=50+Math.random()*80;s.className='cf';s.textContent=e[i%e.length];s.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d-40}px`;document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}
function anim(){const a=$('#app');a.classList.add('anim');setTimeout(()=>a.classList.remove('anim'),900);document.querySelectorAll('.big[data-n]').forEach(el=>{const n=+el.dataset.n,t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/800);el.textContent=rp(n*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(f)})(t0)})}

/* ===== Scanner ala CamScanner ===== */
let SC={pages:[],q:[],img:null,pts:[],base:null,filter:'warna',stream:null,adj:{b:0,k:50,t:45},fo:null,rq:0},drag=-1;
const sct=()=>$('#scn'),cnv=(w,h)=>{const c=document.createElement('canvas');c.width=w;c.height=h;return c};
const stopCam=()=>{if(SC.stream){SC.stream.getTracks().forEach(t=>t.stop());SC.stream=null}};
const rot90=c=>{const o=cnv(c.height,c.width),x=o.getContext('2d');x.translate(o.width,0);x.rotate(Math.PI/2);x.drawImage(c,0,0);return o};
const tb=(l,m,r)=>`<div class="scTop">${l}<span>${m}</span>${r}</div>`;
const closeScn=()=>{stopCam();sct().className='';sct().innerHTML=''};
async function scCam(){stopCam();const s=sct();s.className='on';
  s.innerHTML=tb('<button class="sb" data-a="zx">✕</button>',SC.pages.length+' halaman',`<button class="sb" data-a="zd" ${SC.pages.length?'':'disabled'}>Selesai ✓</button>`)+`<video id="vid" playsinline autoplay muted></video><div class="gd"></div><div class="scBot"><label class="sb">🖼️<input id="sgal" type="file" accept="image/*" multiple hidden></label><button class="shut" data-a="zshut" aria-label="Ambil foto"></button><span style="width:56px"></span></div>`;
  try{const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920}},audio:false}),v=$('#vid');if(!v||!sct().classList.contains('on')){st.getTracks().forEach(t=>t.stop());return}SC.stream=st;v.srcObject=st}catch(e){toast('Kamera belum diizinkan. Pakai 🖼️ untuk pilih foto')}}
async function scNext(){const f=SC.q.shift();if(!f)return scCam();try{const b=await createImageBitmap(f,{imageOrientation:'from-image'}),k=Math.min(1,1800/Math.max(b.width,b.height)),c=cnv(b.width*k|0,b.height*k|0);c.getContext('2d').drawImage(b,0,0,c.width,c.height);stopCam();scSet(c)}catch(e){toast('Gambar gagal dibaca');scNext()}}
function shut(){const v=$('#vid');if(!v||!v.videoWidth)return toast('Kamera belum siap');const k=Math.min(1,1800/Math.max(v.videoWidth,v.videoHeight)),c=cnv(v.videoWidth*k|0,v.videoHeight*k|0);c.getContext('2d').drawImage(v,0,0,c.width,c.height);stopCam();scSet(c)}
function scSet(c){SC.img=c;SC.pts=detect(c);scCrop()}
function fit(c){const cw=$('#cw'),k=Math.min((cw.clientWidth-16)/c.width,(cw.clientHeight-16)/c.height),w=$('#cwi');w.style.width=c.width*k+'px';w.style.height=c.height*k+'px'}
function scCrop(){const s=sct();s.className='on';
  s.innerHTML=tb('<button class="sb" data-a="zback">↩</button>','Atur sudut kertas','<button class="sb" data-a="zauto">✨ Auto</button>')+`<div id="cw"><div id="cwi"><canvas id="cv"></canvas><svg id="cs" viewBox="0 0 1 1" preserveAspectRatio="none"><polygon fill="#ffd84d33" stroke="#ffd84d" stroke-width="3" vector-effect="non-scaling-stroke"/></svg>${[0,1,2,3].map(i=>`<i class="hd" data-i="${i}"></i>`).join('')}</div></div><div class="scBot"><button class="sb" data-a="zrot">⟳ Putar</button><button class="btn" data-a="zgo">Potong ✂️</button></div>`;
  const cv=$('#cv');cv.width=SC.img.width;cv.height=SC.img.height;cv.getContext('2d').drawImage(SC.img,0,0);fit(SC.img);cropPaint()}
function cropPaint(){SC.pts.forEach(([x,y],i)=>{const h=sct().querySelector(`.hd[data-i="${i}"]`);h.style.left=x*100+'%';h.style.top=y*100+'%'});sct().querySelector('polygon').setAttribute('points',SC.pts.map(p=>p.join(',')).join(' '))}
document.addEventListener('pointerdown',e=>{const h=e.target.closest&&e.target.closest('.hd');if(h){drag=+h.dataset.i;h.setPointerCapture(e.pointerId)}});
document.addEventListener('pointermove',e=>{if(drag<0)return;const r=$('#cwi').getBoundingClientRect(),cl=v=>Math.min(1,Math.max(0,v));SC.pts[drag]=[cl((e.clientX-r.left)/r.width),cl((e.clientY-r.top)/r.height)];cropPaint()});
document.addEventListener('pointerup',()=>drag=-1);
function scFilter(){const F=[['asli','Asli'],['warna','Warna'],['bw','Dokumen'],['abu','Abu-abu']],A=SC.adj;
  sct().innerHTML=tb('<button class="sb" data-a="zrecrop">↩</button>','Pilih filter','<button class="sb" data-a="zrot2">⟳</button>')+`<div id="cw"><div id="cwi"><canvas id="fv"></canvas></div></div><div class="adj" id="adj"><label><span>☀️ Kecerahan</span><input type="range" id="rb" min="-50" max="50" value="${A.b}"></label><label><span>◐ Kontras</span><input type="range" id="rk" min="0" max="100" value="${A.k}"></label><label><span>✒️ Tebal teks</span><input type="range" id="rt2" min="0" max="100" value="${A.t}"></label><button class="sb" data-a="zreset" style="padding:5px 12px;font-size:12px">Reset</button></div><div class="fl">${F.map(([k,l])=>`<button class="sb" data-a="zf" data-v="${k}">${l}</button>`).join('')}<button class="sb" data-a="zadj">🎚️ Atur</button></div><div class="scBot"><button class="btn" style="width:100%" data-a="zsv">Simpan halaman ✓</button></div>`;fvPaint()}
function fvPaint(){const o=filt(SC.base,SC.filter,SC.adj),f=$('#fv');SC.fo=o;f.width=o.width;f.height=o.height;f.getContext('2d').drawImage(o,0,0);fit(o);document.querySelectorAll('.fl [data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===SC.filter))}
document.addEventListener('input',e=>{const m={rb:'b',rk:'k',rt2:'t'}[e.target.id];if(!m)return;SC.adj[m]=+e.target.value;if(!SC.rq){SC.rq=1;requestAnimationFrame(()=>{SC.rq=0;fvPaint()})}});
function zAct(a,b){switch(a){
  case 'zx':closeScn();break;
  case 'zd':closeScn();scanPages=SC.pages;openSheet('Simpan jadi PDF','<div id="sb">'+scanBody()+'</div>');break;
  case 'zmore':closeSheet();SC.pages=scanPages;SC.q=[];scCam();break;
  case 'zback':SC.q=[];scCam();break;
  case 'zshut':shut();break;
  case 'zauto':SC.pts=detect(SC.img);cropPaint();toast('Sudut dideteksi ✨');break;
  case 'zrot':SC.img=rot90(SC.img);SC.pts=detect(SC.img);scCrop();break;
  case 'zgo':SC.base=warp(SC.img,SC.pts);SC.filter='warna';scFilter();break;
  case 'zrecrop':scCrop();break;
  case 'zadj':$('#adj').classList.toggle('on');if(SC.fo)fit(SC.fo);break;
  case 'zreset':SC.adj={b:0,k:50,t:45};$('#rb').value=0;$('#rk').value=50;$('#rt2').value=45;fvPaint();break;
  case 'zrot2':SC.base=rot90(SC.base);fvPaint();break;
  case 'zf':SC.filter=b.dataset.v;fvPaint();break;
  case 'zsv':{const o=filt(SC.base,SC.filter,SC.adj);SC.pages.push({url:o.toDataURL('image/jpeg',.85),w:o.width,h:o.height});toast('Halaman '+SC.pages.length+' tersimpan ✓');conf(innerWidth/2,innerHeight/2);SC.q.length?scNext():scCam();break}}}
// deteksi kertas: Otsu + komponen terang terbesar + 4 sudut ekstrem
function detect(c){const w=Math.min(160,c.width),h=Math.max(1,Math.round(c.height*w/c.width)),t=cnv(w,h);t.getContext('2d').drawImage(c,0,0,w,h);const d=t.getContext('2d').getImageData(0,0,w,h).data,N=w*h,g=new Uint8Array(N),hs=new Array(256).fill(0);
  for(let i=0;i<N;i++){const v=(.3*d[i*4]+.59*d[i*4+1]+.11*d[i*4+2])|0;g[i]=v;hs[v]++}
  let sum=0;for(let i=0;i<256;i++)sum+=i*hs[i];let sB=0,wB=0,best=0,th=128;
  for(let i=0;i<256;i++){wB+=hs[i];if(!wB)continue;const wF=N-wB;if(!wF)break;sB+=i*hs[i];const mB=sB/wB,mF=(sum-sB)/wF,v=wB*wF*(mB-mF)*(mB-mF);if(v>best){best=v;th=i}}
  const lab=new Int32Array(N),st=[];let bl=0,bs=0,L=0;
  for(let s0=0;s0<N;s0++){if(g[s0]<=th||lab[s0])continue;L++;let n=0;st.push(s0);lab[s0]=L;while(st.length){const p=st.pop();n++;const px=p%w,py=(p/w)|0;for(const q of [px>0?p-1:-1,px<w-1?p+1:-1,py>0?p-w:-1,py<h-1?p+w:-1])if(q>=0&&g[q]>th&&!lab[q]){lab[q]=L;st.push(q)}}if(n>bs){bs=n;bl=L}}
  const def=[[.08,.08],[.92,.08],[.92,.92],[.08,.92]];if(bs<N*.15||bs>N*.97)return def;
  let a=[1e9,0,0],b=[-1e9,0,0],c2=[-1e9,0,0],d2=[1e9,0,0];
  for(let i=0;i<N;i++)if(lab[i]===bl){const x=i%w,y=(i/w)|0,s1=x+y,df=x-y;if(s1<a[0])a=[s1,x,y];if(s1>c2[0])c2=[s1,x,y];if(df>b[0])b=[df,x,y];if(df<d2[0])d2=[df,x,y]}
  return [a,b,c2,d2].map(q=>[q[1]/(w-1),q[2]/(h-1)])}
// luruskan perspektif (homografi kotak→segiempat)
function warp(c,n){const W=c.width,H=c.height,q=n.map(([x,y])=>[x*W,y*H]),ds=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
  let ow=Math.max(ds(q[0],q[1]),ds(q[3],q[2])),oh=Math.max(ds(q[0],q[3]),ds(q[1],q[2]));const k=Math.min(1,1400/Math.max(ow,oh,1));ow=Math.max(40,ow*k|0);oh=Math.max(40,oh*k|0);
  const [[x0,y0],[x1,y1],[x2,y2],[x3,y3]]=q,dx1=x1-x2,dx2=x3-x2,dx3=x0-x1+x2-x3,dy1=y1-y2,dy2=y3-y2,dy3=y0-y1+y2-y3;let g=0,h=0;
  if(dx3||dy3){const de=dx1*dy2-dx2*dy1;g=(dx3*dy2-dx2*dy3)/de;h=(dx1*dy3-dx3*dy1)/de}
  const a=x1-x0+g*x1,b=x3-x0+h*x3,dd=y1-y0+g*y1,e=y3-y0+h*y3,sd=c.getContext('2d').getImageData(0,0,W,H).data,o=cnv(ow,oh),ox=o.getContext('2d'),od=ox.createImageData(ow,oh),p=od.data;
  for(let j=0;j<oh;j++){const v=j/oh;for(let i=0;i<ow;i++){const u=i/ow,z=g*u+h*v+1,sx=(a*u+b*v+x0)/z,sy=(dd*u+e*v+y0)/z,ix=Math.min(W-2,Math.max(0,sx|0)),iy=Math.min(H-2,Math.max(0,sy|0)),fx=Math.min(1,Math.max(0,sx-ix)),fy=Math.min(1,Math.max(0,sy-iy)),s=(iy*W+ix)*4,t=(i+j*ow)*4;
    for(let ch=0;ch<3;ch++)p[t+ch]=(sd[s+ch]*(1-fx)+sd[s+4+ch]*fx)*(1-fy)+(sd[s+W*4+ch]*(1-fx)+sd[s+W*4+4+ch]*fx)*fy;p[t+3]=255}}
  ox.putImageData(od,0,0);return o}
// filter ala CamScanner: latar diestimasi dari piksel TERTERANG per blok (bukan rata-rata), teks dipertebal lalu dikontraskan
function bgOf(c){if(c._bg)return c._bg;const w=c.width,h=c.height,B=12,sw=Math.ceil(w/B),sh=Math.ceil(h/B),d=c.getContext('2d').getImageData(0,0,w,h).data,s=cnv(sw,sh),sx=s.getContext('2d'),si=sx.createImageData(sw,sh),sp=si.data;
  for(let by=0;by<sh;by++)for(let bx=0;bx<sw;bx++){let r=0,g=0,b=0;for(let y=by*B;y<Math.min(h,by*B+B);y+=2)for(let x=bx*B;x<Math.min(w,bx*B+B);x+=2){const i=(y*w+x)*4;if(d[i]>r)r=d[i];if(d[i+1]>g)g=d[i+1];if(d[i+2]>b)b=d[i+2]}const o=(by*sw+bx)*4;sp[o]=r;sp[o+1]=g;sp[o+2]=b;sp[o+3]=255}
  sx.putImageData(si,0,0);const big=cnv(w,h),bx2=big.getContext('2d');bx2.imageSmoothingQuality='high';bx2.drawImage(s,0,0,w,h);return c._bg=bx2.getImageData(0,0,w,h).data}
function dil(a,w,h,k){const t=new Float32Array(a.length);for(let y=0;y<h;y++){const r=y*w;for(let x=0;x<w;x++){const i=r+x;let m=a[i];if(x>0&&a[i-1]<m)m=a[i-1];if(x<w-1&&a[i+1]<m)m=a[i+1];t[i]=m}}
  for(let y=0;y<h;y++){const r=y*w;for(let x=0;x<w;x++){const i=r+x;let m=t[i];if(y>0&&t[i-w]<m)m=t[i-w];if(y<h-1&&t[i+w]<m)m=t[i+w];a[i]=a[i]*(1-k)+m*k}}}
function filt(c,m,A){A=A||SC.adj;const w=c.width,h=c.height,o=cnv(w,h),x=o.getContext('2d');x.drawImage(c,0,0);if(m==='asli'&&A.b===0&&A.k===50)return o;
  const id=x.getImageData(0,0,w,h),p=id.data,N=w*h,cl=v=>v<0?0:v>255?255:v;
  if(m==='asli'){const kf=.5+A.k/100;for(let i=0;i<N*4;i+=4)for(let k=0;k<3;k++)p[i+k]=cl((p[i+k]-128)*kf+128+A.b*2)}
  else{const q=bgOf(c),ch=m==='warna'?3:1,R=[];for(let k=0;k<ch;k++)R.push(new Float32Array(N));
    for(let i=0,j=0;j<N;i+=4,j++){if(ch===1)R[0][j]=(.3*p[i]+.59*p[i+1]+.11*p[i+2])/(.3*q[i]+.59*q[i+1]+.11*q[i+2]+1);else{R[0][j]=p[i]/(q[i]+1);R[1][j]=p[i+1]/(q[i+1]+1);R[2][j]=p[i+2]/(q[i+2]+1)}}
    const a=A.t/100*.85;if(a>0)R.forEach(r=>dil(r,w,h,a));
    let hw=Math.max(.06,.25-(A.k-50)*.003);if(m==='abu')hw*=1.8;const c0=.58-A.b*.004,lo=c0-hw,sp=2*hw;
    for(let i=0,j=0;j<N;i+=4,j++)for(let k=0;k<3;k++){let t=(R[ch===1?0:k][j]-lo)/sp;t=t<0?0:t>1?1:t;p[i+k]=t*t*(3-2*t)*255}}
  x.putImageData(id,0,0);return o}
