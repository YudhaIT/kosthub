name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install
        run: npm install
      - name: Siapkan web dan proyek Android
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          cp node_modules/@fontsource-variable/fredoka/files/fredoka-latin-wght-normal.woff2 www/fredoka.woff2 || echo 'font fredoka tidak ketemu'
          cp node_modules/@fontsource-variable/nunito/files/nunito-latin-wght-normal.woff2 www/nunito.woff2 || echo 'font nunito tidak ketemu'
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Pasang ikon
        continue-on-error: true
        run: |
          python3 -m pip install --break-system-packages pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          res='android/app/src/main/res'
          leg={'mdpi':48,'hdpi':72,'xhdpi':96,'xxhdpi':144,'xxxhdpi':192}
          fgs={'mdpi':108,'hdpi':162,'xhdpi':216,'xxhdpi':324,'xxxhdpi':432}
          ic=Image.open('icon.png').convert('RGBA'); fg=Image.open('icon-fg.png').convert('RGBA')
          for d in leg:
              dr=res+'/mipmap-'+d
              os.makedirs(dr,exist_ok=True)
              a=ic.resize((leg[d],leg[d]),Image.LANCZOS)
              a.save(dr+'/ic_launcher.png')
              m=Image.new('L',a.size,0)
              ImageDraw.Draw(m).ellipse((0,0,a.size[0]-1,a.size[1]-1),fill=255)
              r=Image.new('RGBA',a.size,(0,0,0,0))
              r.paste(a,(0,0),m)
              r.save(dr+'/ic_launcher_round.png')
              fg.resize((fgs[d],fgs[d]),Image.LANCZOS).save(dr+'/ic_launcher_foreground.png')
          open(res+'/values/ic_launcher_background.xml','w').write('<?xml version="1.0" encoding="utf-8"?><resources><color name="ic_launcher_background">#FFD84D</color></resources>')
          print('ICON OK')
          PY
      - name: Build APK
        run: |
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kosthub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: KostHub v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
