name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - name: Build web + Android project
        run: |
          mkdir -p www
          cp index.html www/index.html
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          npx cap add android
          mkdir -p assets
          cp icon.png assets/icon-only.png
          cp icon-fg.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#ffd84d' --iconBackgroundColorDark '#ffd84d'
          sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          npx cap sync android
          cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: kosthub-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: KostHub v${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
